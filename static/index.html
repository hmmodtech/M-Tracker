<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Tracker Login</title>
    <!-- This path is now correct and will work with the fixed app.py -->
    <link rel="stylesheet" href="/static/acf-design-system.css">
</head>
<body class="acf-body-background">
    <main class="acf-login-container">
        <div class="acf-login-card">
            <div class="acf-logo-icon"></div>
            <h1 class="acf-header">M-Tracker</h1>
            <form action="#" method="POST">
                <div class="acf-form-group">
                    <label for="username" class="acf-label">Username</label>
                    <input type="text" id="username" name="username" class="acf-input" required>
                </div>
                <div class="acf-form-group">
                    <label for="password" class="acf-label">Password</label>
                    <input type="password" id="password" name="password" class="acf-input" required>
                </div>
                <button type="submit" class="acf-button acf-button-primary">Login</button>
            </form>
        </div>
    </main>
</body>
</html>
